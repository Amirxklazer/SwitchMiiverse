name: Switch Homebrew Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Write main.c (Miiverse UI)
        run: |
          cat << 'EOF' > main.c
          // Miiverse UI Simulation for Nintendo Switch
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <switch.h>

          #define MAX_POSTS 10

          typedef struct {
              char user[32];
              char body[256];
              char community[64];
          } Post;

          static Post posts[MAX_POSTS] = {
              {"Alice", "Just finished Metroid Dread! What an incredible final boss fight. 🔥", "Metroid Community"},
              {"Bob", "Looking for friends to play Mario Kart 8 Deluxe with. DM me!", "Mario Kart Community"},
              {"YoshiFan", "The new Yoshi's Crafted World update is adorable 🥚", "Yoshi's Island Community"},
              {"Zelda_Lover", "Tears of the Kingdom sky islands are breathtaking.", "Zelda Community"},
              {"SplatKing", "Splatfest this weekend! Team Sweet vs Team Salty.", "Splatoon Community"},
              {"PikminPals", "Pikmin 4 co-op missions are so much fun.", "Pikmin Community"},
              {"SmashMaster", "Any tips for beating Sephiroth in Smash Ultimate?", "Super Smash Bros. Community"},
              {"AnimalXross", "Turnip prices are 587 bells right now! DM for Dodo code.", "Animal Crossing Community"},
              {"XenobladeX", "Finished Xenoblade 3. That ending... 😭", "Xenoblade Community"},
              {"KirbyStar", "Kirby and the Forgotten Land is pure joy.", "Kirby Community"}
          };

          static int selected = 0;
          static int scrollOffset = 0;
          static int viewingPost = -1;

          void draw_rect(int x, int y, int w, int h, u32 color) {
              for(int r=0; r<h; r++) {
                  printf("\x1b[%d;%dH", y+r, x);
                  for(int c=0; c<w; c++) {
                      printf("\x1b[48;2;%d;%d;%dm ", (color>>16)&0xff, (color>>8)&0xff, color&0xff);
                  }
              }
          }

          void print_colored(int x, int y, const char* str, u32 fg, u32 bg) {
              printf("\x1b[%d;%dH\x1b[38;2;%d;%d;%dm\x1b[48;2;%d;%d;%dm%s\x1b[0m",
                     y, x,
                     (fg>>16)&0xff, (fg>>8)&0xff, fg&0xff,
                     (bg>>16)&0xff, (bg>>8)&0xff, bg&0xff,
                     str);
          }

          void draw_feed() {
              consoleClear();
              draw_rect(1, 1, 78, 2, 0x0066CC);
              print_colored(2, 1, "❏ Miiverse (Unofficial)", 0xFFFFFF, 0x0066CC);
              print_colored(60, 1, "[Y] Login", 0x00FF00, 0x0066CC);

              draw_rect(1, 4, 20, 40, 0xCCCCCC);
              print_colored(2, 4, "Communities", 0x000000, 0xCCCCCC);
              const char* comms[] = {
                  "Metroid", "Mario Kart", "Yoshi", "Zelda",
                  "Splatoon", "Pikmin", "Smash", "Animal Crossing",
                  "Xenoblade", "Kirby"
              };
              for(int i=0; i<10; i++) {
                  print_colored(2, 6 + i*2, comms[i], 0x000000, 0xCCCCCC);
              }

              draw_rect(22, 4, 56, 35, 0xFFFFFF);
              print_colored(23, 4, "Latest Posts", 0x0066CC, 0xFFFFFF);
              
              int start = scrollOffset;
              for(int i=0; i<5; i++) {
                  int idx = start + i;
                  if(idx >= MAX_POSTS) break;
                  int line = 6 + i*7;
                  u32 bg = (idx == selected) ? 0xFFEE99 : 0xFFFFFF;
                  char header[64];
                  snprintf(header, sizeof(header), "%s  [%s]", posts[idx].user, posts[idx].community);
                  print_colored(23, line, header, 0x000000, bg);
                  char snippet[51];
                  strncpy(snippet, posts[idx].body, 50);
                  snippet[50] = '\0';
                  print_colored(23, line+1, snippet, 0x333333, bg);
                  if(idx != selected) {
                      draw_rect(23, line+2, 54, 1, 0xDDDDDD);
                  }
              }

              draw_rect(1, 43, 78, 2, 0x0066CC);
              print_colored(2, 43, "A:View  B:Exit  D-Pad:Navigate", 0xFFFFFF, 0x0066CC);
              consoleUpdate(NULL);
          }

          void draw_post_detail(int idx) {
              consoleClear();
              draw_rect(1, 1, 78, 2, 0x0066CC);
              print_colored(2, 1, "❏ Miiverse - Post Detail", 0xFFFFFF, 0x0066CC);
              print_colored(60, 1, "[B] Back", 0x00FF00, 0x0066CC);
              
              draw_rect(2, 4, 76, 5, 0xF0F0F0);
              char userline[64];
              snprintf(userline, sizeof(userline), "Posted by %s in %s", posts[idx].user, posts[idx].community);
              print_colored(4, 4, userline, 0x000000, 0xF0F0F0);
              
              print_colored(4, 6, posts[idx].body, 0x000000, 0xF0F0F0);
              print_colored(4, 12, "Yeah!s: 24   Comments: 3", 0x0066CC, 0xF0F0F0);
              
              draw_rect(2, 14, 76, 20, 0xFFFFFF);
              print_colored(4, 14, "Comments:", 0x000000, 0xFFFFFF);
              print_colored(4, 15, "Tom: So true!", 0x333333, 0xFFFFFF);
              print_colored(4, 16, "Jerry: I had the same experience.", 0x333333, 0xFFFFFF);
              print_colored(4, 17, "User2: Check my screenshot!", 0x333333, 0xFFFFFF);
              
              draw_rect(1, 43, 78, 2, 0x0066CC);
              print_colored(2, 43, "B:Back", 0xFFFFFF, 0x0066CC);
              consoleUpdate(NULL);
          }

          int main(int argc, char **argv) {
              PadState pad;
              consoleInit(NULL);
              padConfigureInput(1, HidNpadStyleSet_NpadStandard);
              padInitializeDefault(&pad);
              
              printf("\x1b[48;2;0;0;0m");
              
              consoleClear();
              draw_rect(1, 1, 78, 2, 0x0066CC);
              print_colored(2, 1, "Welcome to Miiverse (Unofficial)", 0xFFFFFF, 0x0066CC);
              print_colored(2, 10, "Press A to sign in with NNID: amiir", 0x00FF00, 0x000000);
              print_colored(2, 12, "(This is a simulation - no network connection)", 0x888888, 0x000000);
              consoleUpdate(NULL);
              
              bool loggedIn = false;
              while(appletMainLoop() && !loggedIn) {
                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);
                  if(kDown & HidNpadButton_A) loggedIn = true;
              }
              
              while(appletMainLoop()) {
                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);
                  
                  if(viewingPost == -1) {
                      if(kDown & HidNpadButton_Plus) break;
                      
                      if(kDown & HidNpadButton_Down) {
                          selected++;
                          if(selected >= MAX_POSTS) selected = 0;
                          if(selected - scrollOffset >= 5) scrollOffset = selected - 4;
                          if(selected < scrollOffset) scrollOffset = selected;
                      }
                      if(kDown & HidNpadButton_Up) {
                          selected--;
                          if(selected < 0) selected = MAX_POSTS-1;
                          if(selected < scrollOffset) scrollOffset = selected;
                          if(selected - scrollOffset >= 5) scrollOffset = selected - 4;
                      }
                      
                      if(kDown & HidNpadButton_A) {
                          viewingPost = selected;
                      }
                      
                      draw_feed();
                  } else {
                      if(kDown & HidNpadButton_B) {
                          viewingPost = -1;
                      }
                      draw_post_detail(viewingPost);
                  }
              }
              
              consoleExit(NULL);
              return 0;
          }
          EOF

      - name: Generate Makefile
        run: |
          cat << 'MAKEEOF' > Makefile
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO in your environment. export DEVKITPRO=<path to>devkitpro")
          endif

          include $(DEVKITPRO)/libnx/switch_rules

          TARGET      := SwitchMiiverse
          BUILD       := build
          SOURCES     := .
          DATA        := data
          INCLUDES    := .

          ARCH        := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS      := -g -Wall -O2 -ffunction-sections -fdata-sections $(ARCH) $(INCLUDE) -D__SWITCH__
          CXXFLAGS    := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS     := -g $(ARCH)
          LDFLAGS     := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map) -Wl,-z,notext

          LIBS        := -L$(DEVKITPRO)/libnx/lib -L$(DEVKITPRO)/portlibs/switch/lib -lnx

          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT   := $(CURDIR)/$(TARGET)
          export TOPDIR   := $(CURDIR)
          export VPATH    := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir)) \
                              $(foreach dir,$(DATA),$(CURDIR)/$(dir))
          export DEPSDIR  := $(CURDIR)/$(BUILD)

          CFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          CPPFILES    := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.cpp)))
          SFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.s)))

          export OFILES   := $(CFILES:.c=.o) $(CPPFILES:.cpp=.o) $(SFILES:.s=.o)
          export INCLUDE  := $(foreach dir,$(INCLUDES),-I$(TOPDIR)/$(dir)) \
                              -I$(DEVKITPRO)/libnx/include -I$(DEPSDIR)

          .PHONY: $(BUILD) clean all

          all: $(BUILD)

          $(BUILD):
          	@[ -d $@ ] || mkdir -p $@
          	@$(MAKE) --no-print-directory -C $@ -f $(CURDIR)/Makefile

          clean:
          	@echo clean ...
          	@rm -fr $(BUILD) $(TARGET).elf $(TARGET).nro $(TARGET).nacp

          else
          DEPENDS := $(OFILES:.o=.d)
          $(OUTPUT).nro: $(OUTPUT).elf
          $(OUTPUT).elf: $(OFILES)
          	$(CXX) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          -include $(DEPENDS)
          endif
          MAKEEOF

      - name: Build Homebrew
        run: make -f Makefile

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchMiiverse-NRO
          path: ./*.nro
