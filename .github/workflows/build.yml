name: Switch Homebrew Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S switch-dev --noconfirm

      - name: Overwrite and Enforce Clean main.c Source Code
        run: |
          # This template explicitly declares and sets up the pad input structure
          # to properly align with modern libnx compilation architectures
          cat << 'EOF' > main.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <switch.h>

          int main(int argc, char **argv)
          {
              // Declare the layout structure handle for default inputs
              PadState pad;

              consoleInit(NULL);

              // Initialize default handheld or attached controller configurations
              padConfigureInput(1, HidNpadStyleSet_NpadStandard);
              padInitializeDefault(&pad);

              printf("\x1b[16;18mSwitch Homebrew Initialized Successfully!\n");
              printf("\x1b[20;12mPress PLUS (+) on your controller to exit.\n");

              while(appletMainLoop())
              {
                  // Scan the active hardware handles
                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);

                  if (kDown & HidNpadButton_Plus) {
                      break; 
                  }

                  consoleUpdate(NULL);
              }

              consoleExit(NULL);
              return 0;
          }
          EOF

      - name: Generate Robust Makefile
        run: |
          cat << 'EOF' > Makefile
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO in your environment. export DEVKITPRO=<path to>devkitpro")
          endif

          include $(DEVKITPRO)/libnx/switch_rules

          TARGET      := SwitchMiiverse
          BUILD       := build
          SOURCES     := .
          DATA        := data
          INCLUDES    := .

          LD          := $(CXX)

          CFLAGS      := -g -Wall -O2 -mgeneral-regs-only $(MACHDEP) $(INCLUDE) -D__SWITCH__
          CXXFLAGS    := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS     := -g $(MACHDEP)
          LDFLAGS     := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(MACHDEP) -Wl,-Map,$(notdir $*.map)

          LIBS        := -L$(DEVKITPRO)/libnx/lib -L$(DEVKITPRO)/portlibs/switch/lib -lnx

          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT   := $(CURDIR)/$(TARGET)
          export TOPDIR   := $(CURDIR)
          export VPATH    := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir)) $(foreach dir,$(DATA),$(CURDIR)/$(dir))
          export DEPSDIR  := $(CURDIR)/$(BUILD)

          CFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          CPPFILES    := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.cpp)))
          SFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.s)))

          export OFILES   := $(CFILES:.c=.o) $(CPPFILES:.cpp=.o) $(SFILES:.s=.o)
          export INCLUDE  := $(foreach dir,$(INCLUDES),-I$(TOPDIR)/$(dir)) -I$(DEVKITPRO)/libnx/include -I$(DEPSDIR)

          .PHONY: $(BUILD) clean all

          all: $(BUILD)

          $(BUILD):
          	@[ -d $@ ] || mkdir -p $@
          	@$(MAKE) --no-print-directory -C $@ -f $(CURDIR)/Makefile

          clean:
          	@echo clean ...
          	@rm -fr $(BUILD) $(TARGET).elf $(TARGET).nro $(TARGET).nacp

          else
          DEPENDS := $(OFILES:.o=.d)
          $(OUTPUT).nro: $(OUTPUT).elf
          $(OUTPUT).elf: $(OFILES)
          	$(LD) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          -include $(DEPENDS)
          endif
          EOF

      - name: Build
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: SwitchMiiverse-NRO
          path: ./*.nro
