name: Remote Nintendo Switch Homebrew Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_switch:
    name: Build Switch NRO File
    runs-on: ubuntu-latest
    container:
      image: 'devkitpro/devkita64:latest'

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Install Switch Development Tools
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S switch-dev --noconfirm

      - name: Compile Application Using Makefile
        run: |
          # Automatically find whatever case the makefile was saved as
          if [ -f "Makefile" ]; then
            make -f Makefile
          elif [ -f "makefile" ]; then
            make -f makefile
          else
            echo "Listing files to diagnose:"
            ls -la
            exit 1
          fi

      - name: Export Compiled NRO Homebrew Binary
        uses: actions/upload-artifact@v4
        with:
          name: SwitchMiiverse-Homebrew-Build
          path: ./*.nro
          if-no-files-found: error
