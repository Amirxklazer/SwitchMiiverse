name: Switch Miiverse UI Builder (Full)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install SDL2 Libraries
        run: |
          # Sync database and install SDL2 packages (should work without 403 now)
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S switch-sdl2 switch-sdl2_image switch-sdl2_ttf --noconfirm

      - name: Download Handwriting Font
        run: |
          mkdir -p romfs
          cd romfs
          curl -L -o IndieFlower.ttf "https://github.com/google/fonts/raw/main/ofl/indieflower/IndieFlower-Regular.ttf"
          cd ..

      - name: Write main.c (Complete Miiverse UI)
        run: |
          cat << 'EOF' > main.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <switch.h>
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_image.h>
          #include <SDL2/SDL_ttf.h>

          #define SCREEN_W 1280
          #define SCREEN_H 720

          #define MIIVERSE_BLUE   0x0066CC
          #define GREEN           0x00B050
          #define WHITE           0xFFFFFF
          #define LIGHT_GRAY      0xF0F0F0
          #define DARK_GRAY       0x333333
          #define YELLOW_BELL     0xFFD700
          #define POST_BG         0xFFFFFF
          #define SELECTED_BG     0xFFEE99

          #define COMMUNITY_COUNT 10
          #define POST_COUNT      4

          const char* communityNames[COMMUNITY_COUNT] = {
              "Metroid", "Mario Kart", "Yoshi", "Zelda",
              "Splatoon", "Pikmin", "Smash Bros",
              "Animal Crossing", "Xenoblade", "Kirby"
          };

          typedef struct {
              char user[32];
              char body[256];
              char community[64];
              int yeahs;
          } Post;

          Post posts[POST_COUNT] = {
              {"Alice", "Just finished Metroid Dread! What an incredible final boss fight.", "Metroid Community", 24},
              {"Bob", "Looking for friends to play Mario Kart 8 Deluxe with. DM me!", "Mario Kart Community", 13},
              {"YoshiFan", "Yoshi's Crafted World update makes everything so cute!", "Yoshi Community", 45},
              {"ZeldaLover", "Tears of the Kingdom sky islands are breathtaking.", "Zelda Community", 37}
          };

          SDL_Texture* loadMiiIcon(SDL_Renderer* renderer) {
              AccountUid uid;
              if (R_FAILED(accountGetActiveUser(&uid))) return NULL;
              u8* buf = NULL;
              u32 size = 0;
              if (R_FAILED(accountGetUserImage(&uid, NULL, &size, NULL)) || size == 0) return NULL;
              buf = (u8*)malloc(size);
              if (!buf) return NULL;
              if (R_FAILED(accountGetUserImage(&uid, buf, &size, NULL))) { free(buf); return NULL; }
              SDL_RWops* rw = SDL_RWFromConstMem(buf, size);
              SDL_Surface* surface = IMG_Load_RW(rw, 1);
              free(buf);
              if (!surface) return NULL;
              SDL_Texture* tex = SDL_CreateTextureFromSurface(renderer, surface);
              SDL_FreeSurface(surface);
              return tex;
          }

          SDL_Texture* createDefaultMii(SDL_Renderer* renderer, int size) {
              SDL_Surface* surface = SDL_CreateRGBSurface(0, size, size, 32, 0,0,0,0);
              SDL_FillRect(surface, NULL, SDL_MapRGB(surface->format, 0xCC,0xCC,0xCC));
              SDL_Texture* tex = SDL_CreateTextureFromSurface(renderer, surface);
              SDL_FreeSurface(surface);
              return tex;
          }

          void drawRect(SDL_Renderer* r, int x, int y, int w, int h, u32 color) {
              SDL_SetRenderDrawColor(r, (color>>16)&0xFF, (color>>8)&0xFF, color&0xFF, 255);
              SDL_Rect rc = {x, y, w, h};
              SDL_RenderFillRect(r, &rc);
          }

          void drawText(SDL_Renderer* r, TTF_Font* font, int x, int y, const char* text, u32 color) {
              SDL_Color c = {(color>>16)&0xFF, (color>>8)&0xFF, color&0xFF, 255};
              SDL_Surface* s = TTF_RenderUTF8_Blended(font, text, c);
              if (!s) return;
              SDL_Texture* t = SDL_CreateTextureFromSurface(r, s);
              if (!t) { SDL_FreeSurface(s); return; }
              SDL_Rect dst = {x, y, s->w, s->h};
              SDL_RenderCopy(r, t, NULL, &dst);
              SDL_FreeSurface(s);
              SDL_DestroyTexture(t);
          }

          void drawPostEntry(SDL_Renderer* r, TTF_Font* font, TTF_Font* smallFont,
                             SDL_Texture* defaultMii, Post* p, int x, int y, int w, bool selected) {
              u32 bg = selected ? SELECTED_BG : POST_BG;
              drawRect(r, x, y, w, 80, bg);
              if (defaultMii) {
                  SDL_Rect dst = {x+10, y+10, 60, 60};
                  SDL_RenderCopy(r, defaultMii, NULL, &dst);
              }
              drawText(r, font, x+80, y+10, p->user, DARK_GRAY);
              drawText(r, smallFont, x+80, y+35, p->community, MIIVERSE_BLUE);
              char snippet[100];
              strncpy(snippet, p->body, 90);
              snippet[89] = '\0';
              drawText(r, smallFont, x+80, y+55, snippet, DARK_GRAY);
          }

          int main(int argc, char* argv[]) {
              SDL_Init(SDL_INIT_VIDEO);
              IMG_Init(IMG_INIT_JPG | IMG_INIT_PNG);
              TTF_Init();
              SDL_Window* window = SDL_CreateWindow("Miiverse", SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, SCREEN_W, SCREEN_H, 0);
              SDL_Renderer* renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);

              TTF_Font* fontHand = TTF_OpenFont("romfs:/IndieFlower.ttf", 28);
              TTF_Font* fontSmall = TTF_OpenFont("romfs:/IndieFlower.ttf", 18);
              TTF_Font* fontBig = TTF_OpenFont("romfs:/IndieFlower.ttf", 36);
              if (!fontHand) { fontHand = TTF_OpenFont("romfs:/font.ttf", 24); fontSmall = TTF_OpenFont("romfs:/font.ttf", 14); fontBig = TTF_OpenFont("romfs:/font.ttf", 32); }

              SDL_Texture* userMii = loadMiiIcon(renderer);
              SDL_Texture* defaultMii = createDefaultMii(renderer, 60);

              bool running = true;
              bool viewingPost = false;
              int selectedPost = 0;
              int detailPost = -1;

              while (running) {
                  SDL_Event e;
                  while (SDL_PollEvent(&e)) { if (e.type == SDL_QUIT) running = false; }

                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);

                  if (viewingPost) {
                      if (kDown & HidNpadButton_B) viewingPost = false;
                  } else {
                      if (kDown & HidNpadButton_Plus) running = false;
                      if (kDown & HidNpadButton_Down) selectedPost = (selectedPost + 1) % POST_COUNT;
                      if (kDown & HidNpadButton_Up) selectedPost = (selectedPost - 1 + POST_COUNT) % POST_COUNT;
                      if (kDown & HidNpadButton_A) { viewingPost = true; detailPost = selectedPost; }
                      if (kDown & HidNpadButton_Y) posts[selectedPost].yeahs++;
                  }

                  SDL_SetRenderDrawColor(renderer, 0xF0, 0xF0, 0xF0, 255);
                  SDL_RenderClear(renderer);

                  if (!viewingPost) {
                      drawRect(renderer, 0, 0, SCREEN_W, 60, MIIVERSE_BLUE);
                      drawText(renderer, fontBig, 20, 10, "Miiverse", WHITE);
                      SDL_Rect bell = {1180, 10, 40, 40}; SDL_SetRenderDrawColor(renderer, 255,215,0,255); SDL_RenderFillRect(renderer, &bell);
                      drawText(renderer, fontSmall, 1190, 55, "3", WHITE);
                      drawRect(renderer, 1100, 10, 70, 40, GREEN);
                      drawText(renderer, fontSmall, 1105, 15, "Comms", WHITE);
                      if (userMii) { SDL_Rect miiR = {1230, 5, 50, 50}; SDL_RenderCopy(renderer, userMii, NULL, &miiR); }

                      drawRect(renderer, 10, 70, 280, 50, LIGHT_GRAY);
                      drawText(renderer, fontSmall, 20, 80, "Communities", MIIVERSE_BLUE);
                      int yPos = 130;
                      for (int i = 0; i < COMMUNITY_COUNT; i++) {
                          drawRect(renderer, 10, yPos, 280, 50, WHITE);
                          drawText(renderer, fontSmall, 20, yPos+10, communityNames[i], DARK_GRAY);
                          yPos += 55;
                          if (yPos > 600) break;
                      }

                      drawRect(renderer, 310, 70, 960, 50, LIGHT_GRAY);
                      drawText(renderer, fontSmall, 320, 80, "Latest Posts", MIIVERSE_BLUE);
                      yPos = 130;
                      for (int i = 0; i < POST_COUNT; i++) {
                          drawPostEntry(renderer, fontHand, fontSmall, defaultMii, &posts[i], 310, yPos, 960, (i == selectedPost));
                          yPos += 85;
                      }

                      drawRect(renderer, 0, SCREEN_H-40, SCREEN_W, 40, MIIVERSE_BLUE);
                      drawText(renderer, fontSmall, 20, SCREEN_H-30, "A:View  B:Back  Y:Yeah!  +:Exit", WHITE);
                  } else {
                      drawRect(renderer, 0, 0, SCREEN_W, 60, MIIVERSE_BLUE);
                      drawText(renderer, fontBig, 20, 10, "Miiverse - Post", WHITE);
                      drawText(renderer, fontSmall, 1150, 15, "B: Back", WHITE);

                      drawRect(renderer, 20, 80, 1240, 120, WHITE);
                      if (defaultMii) { SDL_Rect dMii = {40, 100, 80, 80}; SDL_RenderCopy(renderer, defaultMii, NULL, &dMii); }
                      drawText(renderer, fontHand, 140, 90, posts[detailPost].user, DARK_GRAY);
                      drawText(renderer, fontSmall, 140, 120, posts[detailPost].community, MIIVERSE_BLUE);

                      drawRect(renderer, 20, 220, 1240, 200, WHITE);
                      drawText(renderer, fontHand, 40, 230, posts[detailPost].body, DARK_GRAY);

                      char yeahStr[64];
                      snprintf(yeahStr, sizeof(yeahStr), "Yeah!s: %d   Comments: 3", posts[detailPost].yeahs);
                      drawText(renderer, fontSmall, 40, 430, yeahStr, MIIVERSE_BLUE);

                      drawRect(renderer, 20, 460, 1240, 200, LIGHT_GRAY);
                      drawText(renderer, fontSmall, 40, 470, "Comments:", DARK_GRAY);
                      drawText(renderer, fontSmall, 60, 500, "Tom: So true!", DARK_GRAY);
                      drawText(renderer, fontSmall, 60, 520, "Jerry: I had the same experience.", DARK_GRAY);
                      drawText(renderer, fontSmall, 60, 540, "User2: Check my screenshot!", DARK_GRAY);
                  }

                  SDL_RenderPresent(renderer);
              }

              if (userMii) SDL_DestroyTexture(userMii);
              if (defaultMii) SDL_DestroyTexture(defaultMii);
              TTF_CloseFont(fontHand); TTF_CloseFont(fontSmall); TTF_CloseFont(fontBig);
              SDL_DestroyRenderer(renderer);
              SDL_DestroyWindow(window);
              TTF_Quit();
              IMG_Quit();
              SDL_Quit();
              return 0;
          }
          EOF

      - name: Generate Makefile with SDL2 paths
        run: |
          cat << 'MAKEEOF' > Makefile
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO in your environment.")
          endif
          include $(DEVKITPRO)/libnx/switch_rules

          APP_TITLE   := Miiverse
          APP_AUTHOR  := amirxklazer
          APP_VERSION := 1.0

          TARGET      := SwitchMiiverse
          BUILD       := build
          SOURCES     := .
          DATA        := data
          INCLUDES    := .

          # Explicit SDL2 paths
          SDL2_PREFIX := $(DEVKITPRO)/portlibs/switch
          SDL2_INC    := -I$(SDL2_PREFIX)/include/SDL2
          SDL2_LIBS   := -L$(SDL2_PREFIX)/lib -lSDL2 -lSDL2_image -lSDL2_ttf

          export INCLUDE := $(foreach dir,$(INCLUDES),-I$(TOPDIR)/$(dir)) -I$(DEVKITPRO)/libnx/include -I$(DEPSDIR) $(SDL2_INC)

          ARCH        := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS      := -g -Wall -O2 -ffunction-sections -fdata-sections $(ARCH) $(INCLUDE) -D__SWITCH__
          CXXFLAGS    := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS     := -g $(ARCH)
          LDFLAGS     := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map) -Wl,-z,notext

          LIBS        := -L$(DEVKITPRO)/libnx/lib -L$(DEVKITPRO)/portlibs/switch/lib -lnx $(SDL2_LIBS)

          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT   := $(CURDIR)/$(TARGET)
          export TOPDIR   := $(CURDIR)
          export VPATH    := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir)) \
                              $(foreach dir,$(DATA),$(CURDIR)/$(dir))
          export DEPSDIR  := $(CURDIR)/$(BUILD)

          CFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          CPPFILES    := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.cpp)))
          SFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.s)))

          export OFILES   := $(CFILES:.c=.o) $(CPPFILES:.cpp=.o) $(SFILES:.s=.o)

          .PHONY: $(BUILD) clean all

          all: $(BUILD)

          $(BUILD):
          	@[ -d $@ ] || mkdir -p $@
          	@$(MAKE) --no-print-directory -C $@ -f $(CURDIR)/Makefile

          clean:
          	@echo clean ...
          	@rm -fr $(BUILD) $(TARGET).elf $(TARGET).nro $(TARGET).nacp

          else
          DEPENDS := $(OFILES:.o=.d)
          $(OUTPUT).nro: $(OUTPUT).elf
          $(OUTPUT).elf: $(OFILES)
          	$(CXX) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          -include $(DEPENDS)
          endif
          MAKEEOF

      - name: Build Homebrew
        run: make -f Makefile

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchMiiverse-NRO
          path: ./*.nro
